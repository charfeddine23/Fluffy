name: Android CI/CD Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, and Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Determine Dynamic Version (Auto-Incrementing)
        id: versioning
        run: |
          # Read base Major and Minor from version.properties
          if [ -f "version.properties" ]; then
            MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          fi
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}

          # Use GitHub run_number for strictly increasing patch version and versionCode
          RUN_NUM="${{ github.run_number }}"
          PATCH="$RUN_NUM"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((1000 + RUN_NUM))

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "🚀 Target Release: Fluffy v${VERSION_NAME}"
          echo "🔢 Monotonic Version Code: ${VERSION_CODE}"
          echo "=========================================="

      - name: Setup Persistent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Use user secret if provided in repository secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "✅ Loaded signing keystore from KEYSTORE_BASE64 secret."
          # 2. Use persistent committed repository keystore
          elif [ -f "my-upload-key.jks" ]; then
            echo "✅ Using persistent repository keystore my-upload-key.jks."
          # 3. Use committed base64 keystore
          elif [ -f "my-upload-key.base64" ]; then
            base64 -d my-upload-key.base64 > my-upload-key.jks
            echo "✅ Decoded persistent keystore from my-upload-key.base64."
          else
            echo "❌ Error: Release keystore not found! A persistent keystore is required for app updates."
            exit 1
          fi

      - name: Build Signed Release APK with Dynamic Versioning
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}" \
            --no-daemon

      - name: Package & Rename Release APK
        id: package_apk
        run: |
          VERSION="${{ steps.versioning.outputs.version_name }}"
          APK_NAME="Fluffy-v${VERSION}.apk"

          # Find the built release APK
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ ! -f "$BUILT_APK" ]; then
            echo "❌ Error: Could not locate built APK file!"
            exit 1
          fi

          cp "$BUILT_APK" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "✅ Prepared artifact: $APK_NAME ($(du -h "$APK_NAME" | cut -f1))"

      - name: Clean Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Checking for previous releases to remove..."
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r old_tag; do
            if [ -n "$old_tag" ]; then
              echo "Removing previous release & tag: $old_tag"
              gh release delete "$old_tag" --cleanup-tag -y || true
            fi
          done

      - name: Publish New Version to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.version_name }}
          name: Fluffy v${{ steps.versioning.outputs.version_name }}
          files: ${{ steps.package_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 🫧 Fluffy Notes - Release v${{ steps.versioning.outputs.version_name }}

            ✨ New production build with auto-incremented version code and persistent signing certificate.

            #### 📦 Release Asset:
            - **`${{ steps.package_apk.outputs.apk_name }}`**

            #### 🔄 In-Place Update Support:
            - **Version Code**: `${{ steps.versioning.outputs.version_code }}` (incremented)
            - **Signature**: Consistent cryptographic certificate (can be installed directly over previous builds without uninstalling).

            #### 💎 Features & Aesthetics:
            - **Liquid Glass / Frosted Glass** UI with Chromatic Dispersion & Inner Highlights.
            - **Biometric Authentication** (Fingerprint / Face Unlock).
            - **Left-Edge Swipe Drawer** with quick settings.
            - **Frosted Edge Mist / Blur** on category tabs.
            - **Room Database** offline-first encryption and local storage.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
