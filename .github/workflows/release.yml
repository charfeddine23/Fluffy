name: Build and Publish Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Fluffy APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Extract App Version Name
        id: get_version
        run: |
          # Extract versionName from app/build.gradle.kts
          VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/versionName\s*=\s*"([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION"

      - name: Prepare Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "$RUNNER_TEMP/release.keystore"
          else
            keytool -genkey -v -keystore "$RUNNER_TEMP/release.keystore" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Fluffy, OU=Mobile, O=Fluffy, L=City, S=State, C=US"
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            # Fallback to any built APK
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"

          TARGET_APK_NAME="Fluffy.v${APP_VERSION}.apk"
          cp "$APK_FILE" "$TARGET_APK_NAME"
          echo "Renamed APK to: $TARGET_APK_NAME"
          ls -la "$TARGET_APK_NAME"

      - name: Delete Old Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up previous releases to keep only the latest version..."
          OLD_RELEASES=$(gh release list --json tagName -q '.[].tagName' || true)
          for tag in $OLD_RELEASES; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --cleanup-tag -y || true
          done

      - name: Publish New Release to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${APP_VERSION}"
          RELEASE_TITLE="Fluffy v${APP_VERSION}"
          APK_NAME="Fluffy.v${APP_VERSION}.apk"

          gh release create "$TAG_NAME" "$APK_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "### ✨ Fluffy Liquid Glass Notes - Release $TAG_NAME

تم بناء هذه النسخة تلقائياً بواسطة GitHub Actions بصيغة:
📦 **$APK_NAME**

#### الميزات:
- تصميم Liquid Glass / Frosted Glass مع التشتت اللوني والظلال الداخلية.
- دعم الوضع الليلي والنهاري.
- قوائم مهام تفاعلية وتسجيل صوتي.
- حفظ تلقائي محلي باستخدام Room Database."
